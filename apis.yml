aid: jinsheng-new-energy
name: Jinsheng New Energy
description: 'Guangdong Jinsheng New Energy Co., Ltd. (广东金晟新能源股份有限公司) is a Chinese
  lithium-battery recycling and materials company headquartered in Zhaoqing, Guangdong,
  founded in 2010 and originally focused on nickel sulfate production. It operates a
  closed-loop "urban mine" business: harmless treatment, echelon (second-life) use and
  hydrometallurgical regeneration of retired lithium-ion batteries into battery-grade
  nickel sulfate, cobalt sulfate, manganese sulfate and lithium carbonate, plus ternary
  and iron-phosphate precursors and LFP cathode material, and downstream cells for light
  mobility, commercial and industrial storage, outdoor power stations and solar street
  lighting. Production is split across Zhaoqing (Gaoyao) in Guangdong and Yichun/Ganzhou
  in Jiangxi through the wholly owned subsidiary Jiangxi Ruida New Energy Technology, with
  approved processing capacity of about 204,000 tonnes of spent lithium battery per year.
  Both the parent and Jiangxi Ruida appear on MIIT''s echelon-use and regeneration white
  lists. The company completed a Series C, is a Hurun and Forbes unicorn-list member, and
  has pursued a public listing. It is an industrial materials manufacturer and publishes
  no developer program, API, or machine-readable API contract of any kind.'
